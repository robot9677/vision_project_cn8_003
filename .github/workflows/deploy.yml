name: Deploy to Jetson (self-hosted)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update code
        run: |
          cd ~/vision_project
          git fetch origin
          git reset --hard origin/main

      - name: Restart vision service
        run: |
          sudo systemctl restart vision